# MusicFetch configuration
# Copy to config.yaml and adjust. config.yaml is gitignored (it holds secrets).

# Engine order = QUALITY PRIORITY. Search lists sources top-to-bottom in this
# order and tries the highest-quality tier first. Default favours lossless:
#   qbit (FLAC) -> jiosaavn (320k AAC) -> youtube_music (~128k AAC)
# Reorder freely (or drop a source) to suit your preference, then restart the
# API service. A lossy source that FAILS to download falls back automatically
# (failover to a higher-priority tier).

jiosaavn:
  # scratch space during download, auto-created — safe to leave as-is
  staging_dir: /opt/musicfetch/staging

youtube_music:
  staging_dir: /opt/musicfetch/staging

qbit:
  # FLAC tier — lossless CD rips via local qBittorrent + public trackers.
  url: http://127.0.0.1:1340
  username: qbittorrent
  password: ""            # WebUI password (this file is the template; real one in gitignored config.yaml)
  category: musicfetch
  staging_dir: /opt/musicfetch/staging

engine:
  order: [qbit, jiosaavn, youtube_music]

output:
  # ★ CHANGE THIS FIRST — where finished songs land.
  # Any path works (e.g. ~/Music). Files are filed as:
  #   {root}/{Artist}/{Album}/{Title}.m4a
  root: /path/to/your/music/folder
  # {artist}/{album}/{title} — multi-artist kept as "A; B" per library convention
  unknown_album: Unknown Album

postprocess:
  musicbrainz: true
  lyrics: true
  cover: true
  musicbrainz_ua: "MusicFetch/0.1 ( https://github.com/AadiSPrabs )"

api:
  host: 127.0.0.1
  port: 8090
  token: ""   # optional; if set, clients must send X-API-Key

telegram_bot:
  token: ""   # BotFather token for your bot
  allowed_chats: []   # owner allowlist; add your telegram chat ids
